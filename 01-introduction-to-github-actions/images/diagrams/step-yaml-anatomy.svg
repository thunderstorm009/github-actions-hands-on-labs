<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="851" viewBox="0 0 1420 851">
<rect width="100%" height="100%" rx="20" fill="#f5f8fc"/>
<text x="34" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142b4a">Lab 01 · Workflow YAML anatomy</text>
<text x="34" y="70" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Code illustration from .github/workflows/basic-checkout.yml · not an IDE screenshot</text>
<rect x="34" y="126" width="850" height="691" rx="14" fill="#101b2b"/>
<text x="52" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">01</text>
<text x="88" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">name: Basic checkout</text>
<rect x="42" y="161" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">02</text>
<text x="88" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">on:</text>
<rect x="42" y="182" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">03</text>
<text x="88" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  push:</text>
<rect x="42" y="203" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">04</text>
<text x="88" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    branches: [main]</text>
<rect x="42" y="224" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">05</text>
<text x="88" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  pull_request:</text>
<text x="52" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">06</text>
<text x="88" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  workflow_dispatch:</text>
<text x="52" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">07</text>
<text x="88" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">permissions:</text>
<rect x="42" y="287" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">08</text>
<text x="88" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  contents: read</text>
<text x="52" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">09</text>
<text x="88" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">jobs:</text>
<rect x="42" y="329" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">10</text>
<text x="88" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  inspect:</text>
<rect x="42" y="350" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">11</text>
<text x="88" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    name: Inspect the repository on Ubuntu</text>
<rect x="42" y="371" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">12</text>
<text x="88" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    runs-on: ubuntu-latest</text>
<rect x="42" y="392" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="408" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">13</text>
<text x="88" y="408" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    steps:</text>
<rect x="42" y="413" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="429" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">14</text>
<text x="88" y="429" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - name: Check out this commit</text>
<rect x="42" y="434" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="450" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">15</text>
<text x="88" y="450" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        uses: actions/checkout@v6</text>
<rect x="42" y="455" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="471" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">16</text>
<text x="88" y="471" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - name: List repository files</text>
<rect x="42" y="476" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="492" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">17</text>
<text x="88" y="492" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        run: ls -la</text>
<rect x="42" y="497" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="513" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">18</text>
<text x="88" y="513" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - name: Show system and tool versions</text>
<rect x="42" y="518" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="534" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">19</text>
<text x="88" y="534" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        run: |</text>
<rect x="42" y="539" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="555" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">20</text>
<text x="88" y="555" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          echo "Runner OS: $RUNNER_OS"</text>
<text x="52" y="576" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">21</text>
<text x="88" y="576" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          uname -a</text>
<text x="52" y="597" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">22</text>
<text x="88" y="597" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          node --version</text>
<text x="52" y="618" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">23</text>
<text x="88" y="618" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          python3 --version</text>
<text x="52" y="639" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">24</text>
<text x="88" y="639" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          git --version</text>
<text x="52" y="660" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">25</text>
<text x="88" y="660" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - name: Set and read a custom environment variable</text>
<rect x="42" y="665" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="681" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">26</text>
<text x="88" y="681" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        env:</text>
<rect x="42" y="686" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="702" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">27</text>
<text x="88" y="702" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">          LAB_GREETING: Hello from the workflow</text>
<rect x="42" y="707" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="723" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">28</text>
<text x="88" y="723" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        run: echo "$LAB_GREETING"</text>
<rect x="42" y="728" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="744" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">29</text>
<text x="88" y="744" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - name: Run only on main branch</text>
<rect x="42" y="749" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="765" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">30</text>
<text x="88" y="765" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        if: github.ref == 'refs/heads/main'</text>
<rect x="42" y="770" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="786" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">31</text>
<text x="88" y="786" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        run: echo "This run is on main"</text>
<rect x="920" y="126" width="465" height="104" rx="14" fill="#e5f1ff" stroke="#b7c8dc"/>
<circle cx="943" cy="150" r="13" fill="#173d68"/><text x="943" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">1</text>
<text x="966" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Workflow name and triggers</text>
<text x="936" y="182" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">`on` chooses push-to-main, PR and manual runs. YAML indentation nests each event.</text>
<text x="936" y="206" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines: 1–6</text>
<rect x="920" y="250" width="465" height="104" rx="14" fill="#e7f7f2" stroke="#b7c8dc"/>
<circle cx="943" cy="274" r="13" fill="#173d68"/><text x="943" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text>
<text x="966" y="279" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Permission boundary</text>
<text x="936" y="306" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Checkout only needs repository contents read access.</text>
<text x="936" y="330" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines: 7–8</text>
<rect x="920" y="374" width="465" height="104" rx="14" fill="#fff2dc" stroke="#b7c8dc"/>
<circle cx="943" cy="398" r="13" fill="#173d68"/><text x="943" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">3</text>
<text x="966" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Job and runner</text>
<text x="936" y="430" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">A job runs on the moving ubuntu-latest hosted image.</text>
<text x="936" y="454" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines: 9–12</text>
<rect x="920" y="498" width="465" height="104" rx="14" fill="#f0eaff" stroke="#b7c8dc"/>
<circle cx="943" cy="522" r="13" fill="#173d68"/><text x="943" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text>
<text x="966" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Ordered steps</text>
<text x="936" y="554" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Action checkout precedes runner shell commands.</text>
<text x="936" y="578" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines: 13–24</text>
<rect x="920" y="622" width="465" height="104" rx="14" fill="#e5f1ff" stroke="#b7c8dc"/>
<circle cx="943" cy="646" r="13" fill="#173d68"/><text x="943" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">5</text>
<text x="966" y="651" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Environment and condition</text>
<text x="936" y="678" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">env is step scoped; if uses the GitHub ref context.</text>
<text x="936" y="702" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines: 25–32</text>
</svg>
