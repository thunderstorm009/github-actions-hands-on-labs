<text x="34" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142b4a">Lab 06 · Minimal workflow token permission</text>
<text x="34" y="70" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Code illustration from least-privilege.yml · not an IDE screenshot</text>
<rect x="34" y="126" width="850" height="292" rx="14" fill="#101b2b"/>
<text x="52" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">01</text>
<text x="88" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">name: Least privilege example</text>
<text x="52" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">02</text>
<text x="88" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">on: [push, pull_request, workflow_dispatch]</text>
<text x="52" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">03</text>
<text x="88" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">permissions:</text>
<rect x="42" y="203" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">04</text>
<text x="88" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  contents: read</text>
<rect x="42" y="224" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">05</text>
<text x="88" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">jobs:</text>
<rect x="42" y="245" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">06</text>
<text x="88" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">  inspect:</text>
<rect x="42" y="266" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">07</text>
<text x="88" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    permissions:</text>
<rect x="42" y="287" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">08</text>
<text x="88" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      contents: read</text>
<rect x="42" y="308" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">09</text>
<text x="88" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    runs-on: ubuntu-latest</text>
<rect x="42" y="329" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">10</text>
<text x="88" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    steps:</text>
<rect x="42" y="350" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">11</text>
<text x="88" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - uses: actions/checkout@v6</text>
<rect x="42" y="371" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">12</text>
<text x="88" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">      - run: echo "Read-only workflow completed"</text>
<rect x="920" y="126" width="465" height="104" rx="14" fill="#e5f1ff" stroke="#b7c8dc"/>
<circle cx="943" cy="150" r="13" fill="#173d68"/><text x="943" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">1</text>
<text x="966" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Trigger</text>
<text x="936" y="182" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Use ordinary push, pull_request and manual events.</text>
<text x="936" y="206" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines 1–2</text>
<rect x="920" y="250" width="465" height="104" rx="14" fill="#e7f7f2" stroke="#b7c8dc"/>
<circle cx="943" cy="274" r="13" fill="#173d68"/><text x="943" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text>
<text x="966" y="279" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Workflow-level default</text>
<text x="936" y="306" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Only repository content read access is granted.</text>
<text x="936" y="330" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines 3–4</text>
<rect x="920" y="374" width="465" height="104" rx="14" fill="#fff2dc" stroke="#b7c8dc"/>
<circle cx="943" cy="398" r="13" fill="#173d68"/><text x="943" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">3</text>
<text x="966" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Job-level scope</text>
<text x="936" y="430" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">The job repeats the minimal permission requirement.</text>
<text x="936" y="454" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines 5–8</text>
<rect x="920" y="498" width="465" height="104" rx="14" fill="#f0eaff" stroke="#b7c8dc"/>
<circle cx="943" cy="522" r="13" fill="#173d68"/><text x="943" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text>
<text x="966" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">No write purpose</text>
<text x="936" y="554" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">This job inspects source and does not modify repository content.</text>
<text x="936" y="578" font-family="Arial,sans-serif" font-size="12" fill="#52657d">Lines 9–12</text>
</svg>
