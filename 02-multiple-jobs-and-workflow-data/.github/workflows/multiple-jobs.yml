name: Multiple jobs and workflow data
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      greeting: ${{ steps.message.outputs.greeting }}
    steps:
      - uses: actions/checkout@v6
      - id: message
        run: echo "greeting=Hello from prepare" >> "$GITHUB_OUTPUT"
      - run: mkdir -p output && echo "Created by prepare" > output/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lab-result
          path: output/result.txt
  parallel-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Independent job can run alongside prepare"
  report:
    needs: [prepare, parallel-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab-result
      - run: cat result.txt
      - run: echo "${{ needs.prepare.outputs.greeting }}" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: echo "A prior step failed"
      - if: always()
        run: echo "Report job finished"
