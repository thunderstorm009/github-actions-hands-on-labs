<text x="34" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142b4a">Lab 05 · Flask factory, route validation and SQLite</text>
<text x="34" y="70" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Code illustration from app/__init__.py + app/routes.py · not an IDE screenshot</text>
<rect x="34" y="126" width="850" height="502" rx="14" fill="#101b2b"/>
<text x="52" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">01</text>
<text x="88" y="156" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">def create_app(test_config=None):</text>
<text x="52" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">02</text>
<text x="88" y="177" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    app = Flask(__name__)</text>
<rect x="42" y="182" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">03</text>
<text x="88" y="198" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    app.config["DATABASE"] = (</text>
<text x="52" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">04</text>
<text x="88" y="219" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        ":memory:" if test_config and test_config.get("TESTING") else "app.db"</text>
<rect x="42" y="224" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">05</text>
<text x="88" y="240" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    )</text>
<text x="52" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">06</text>
<text x="88" y="261" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    if test_config:</text>
<text x="52" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">07</text>
<text x="88" y="282" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        app.config.update(test_config)</text>
<rect x="42" y="287" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">08</text>
<text x="88" y="303" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    from app.db import init_app</text>
<text x="52" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">09</text>
<text x="88" y="324" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    init_app(app)</text>
<rect x="42" y="329" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">10</text>
<text x="88" y="345" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    app.register_blueprint(api)</text>
<rect x="42" y="350" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">11</text>
<text x="88" y="366" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    return app</text>
<rect x="42" y="371" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">12</text>
<text x="88" y="387" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8"></text>
<text x="52" y="408" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">13</text>
<text x="88" y="408" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">@api.post("/items")</text>
<text x="52" y="429" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">14</text>
<text x="88" y="429" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">def create_item():</text>
<rect x="42" y="434" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="450" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">15</text>
<text x="88" y="450" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    data = request.get_json(silent=True) or {}</text>
<text x="52" y="471" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">16</text>
<text x="88" y="471" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    name = data.get("name")</text>
<text x="52" y="492" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">17</text>
<text x="88" y="492" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    if not isinstance(name, str) or not name.strip():</text>
<text x="52" y="513" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">18</text>
<text x="88" y="513" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">        abort(400, "name is required")</text>
<rect x="42" y="518" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="534" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">19</text>
<text x="88" y="534" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    name = name.strip()</text>
<text x="52" y="555" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">20</text>
<text x="88" y="555" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    cursor = get_db().execute("INSERT INTO items(name) VALUES (?)", (name,))</text>
<rect x="42" y="560" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="576" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">21</text>
<text x="88" y="576" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    get_db().commit()</text>
<rect x="42" y="581" width="834" height="21" rx="4" fill="#213c5c"/>
<text x="52" y="597" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#91a5ba">22</text>
<text x="88" y="597" font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#e2edf8">    return jsonify({"id": cursor.lastrowid, "name": name}), 201</text>
