<circle cx="943" cy="274" r="13" fill="#173d68"/><text x="943" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text>
<text x="966" y="279" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Test configuration</text>
<text x="936" y="306" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Tests override the in-memory/default DB with tmp_path/test.sqlite.</text>
