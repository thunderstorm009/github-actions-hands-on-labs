<text x="966" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Validate request</text>
<text x="936" y="430" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">Missing or blank name returns HTTP 400.</text>
