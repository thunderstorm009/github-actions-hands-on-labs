<circle cx="943" cy="522" r="13" fill="#173d68"/><text x="943" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text>
<text x="966" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142b4a">Parameterized SQL</text>
<text x="936" y="554" font-family="Arial,sans-serif" font-size="13.5" fill="#40566f">The ? placeholder keeps input as data; commit stores the row.</text>
