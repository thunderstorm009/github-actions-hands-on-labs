name: Greeting
description: Say hello to a supplied name
inputs:
  name:
    description: Person to greet
    required: true
outputs:
  greeting:
    description: Greeting text
    value: ${{ steps.make.outputs.greeting }}
runs:
  using: composite
  steps:
    - id: make
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: echo "greeting=Hello, $NAME" >> "$GITHUB_OUTPUT"
