<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#142b4a">Docker Hub secret handling boundary</text><text x="40" y="77" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Secrets are injected only into the trusted publishing job; they are not part of the image.</text><path d="M265 265 L350 265" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="307.5" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">runtime injection</text><path d="M580 265 L665 265" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="622.5" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">login action</text><path d="M895 265 L980 265" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="937.5" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">authenticated push</text><rect x="40" y="190" width="225" height="145" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="65" cy="215" r="13" fill="#3b82f6"/><text x="65" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">1</text><text x="88" y="220" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">GitHub Secrets</text><text x="56" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">DOCKER_USERNAME</text><text x="56" y="270" font-family="Arial,sans-serif" font-size="13" fill="#334155">DOCKER_PASSWORD token</text><text x="56" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#3b82f6">STORED ENCRYPTED</text><rect x="350" y="190" width="230" height="145" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="375" cy="215" r="13" fill="#16a34a"/><text x="375" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text><text x="398" y="220" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">Publish job</text><text x="366" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">runs on main push</text><text x="366" y="270" font-family="Arial,sans-serif" font-size="13" fill="#334155">or manual main run</text><text x="366" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#16a34a">TRUSTED REF</text><rect x="665" y="190" width="230" height="145" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="690" cy="215" r="13" fill="#d97706"/><text x="690" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">3</text><text x="713" y="220" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">docker/login-action</text><text x="681" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">reads secret inputs</text><text x="681" y="270" font-family="Arial,sans-serif" font-size="13" fill="#334155">does not print them</text><text x="681" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706">AUTHENTICATE</text><rect x="980" y="190" width="200" height="145" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="1005" cy="215" r="13" fill="#7c3aed"/><text x="1005" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text><text x="1028" y="220" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">Docker Hub</text><text x="996" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">push image tags</text><text x="996" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">REGISTRY</text><line x1="40" y1="518" x2="1160" y2="518" stroke="#d6e0eb"/><text x="40" y="542" font-family="Arial,sans-serif" font-size="13" fill="#40566f">Pull-request CI has no login action or access to these secrets. Never print or commit secret values.</text></svg>