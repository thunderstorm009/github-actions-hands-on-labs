<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Trusted Docker Hub publishing</title><desc id="desc">Build and test first; authenticate only after the image passes. Pull requests cannot use publishing secrets.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs><rect width="1280" height="620" rx="24" fill="#f4f7fb"/>
<text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Trusted Docker Hub publishing</text>
<text x="42" y="80" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Build and test first; authenticate only after the image passes. Pull requests cannot use publishing secrets.</text><rect x="30" y="130" width="1220" height="360" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="55" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">TRUSTED PUBLISH JOB · push to main or manual dispatch on main</text><rect x="45" y="235" width="205" height="190" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="69" cy="259" r="13" fill="#3b82f6"/><text x="69" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">1</text><text x="91" y="264" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Main event</text><text x="60" y="300" font-family="Arial,sans-serif" font-size="13" fill="#334155">push / manual run</text><text x="60" y="322" font-family="Arial,sans-serif" font-size="13" fill="#334155">main branch only</text><rect x="285" y="235" width="205" height="190" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="309" cy="259" r="13" fill="#16a34a"/><text x="309" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">2</text><text x="331" y="264" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Build + test</text><text x="300" y="300" font-family="Arial,sans-serif" font-size="13" fill="#334155">build Docker image</text><text x="300" y="322" font-family="Arial,sans-serif" font-size="13" fill="#334155">assert marker + health</text><rect x="525" y="235" width="205" height="190" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="549" cy="259" r="13" fill="#d97706"/><text x="549" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">3</text><text x="571" y="264" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Authenticate</text><text x="540" y="300" font-family="Arial,sans-serif" font-size="13" fill="#334155">Docker login action</text><text x="540" y="322" font-family="Arial,sans-serif" font-size="13" fill="#334155">GitHub token secret</text><rect x="765" y="235" width="205" height="190" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="789" cy="259" r="13" fill="#7c3aed"/><text x="789" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">4</text><text x="811" y="264" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Tag + push</text><text x="780" y="300" font-family="Arial,sans-serif" font-size="13" fill="#334155">latest</text><text x="780" y="322" font-family="Arial,sans-serif" font-size="13" fill="#334155">full commit SHA</text><rect x="1005" y="235" width="205" height="190" rx="16" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="1029" cy="259" r="13" fill="#e11d48"/><text x="1029" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">5</text><text x="1051" y="264" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Docker Hub</text><text x="1020" y="300" font-family="Arial,sans-serif" font-size="13" fill="#334155">mynginx repository</text><text x="1020" y="322" font-family="Arial,sans-serif" font-size="13" fill="#334155">two published tags</text><path d="M250 330 L285 330" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 330 L525 330" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 330 L765 330" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M970 330 L1005 330" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="540" font-family="Arial,sans-serif" font-size="14" fill="#40566f">Image references use the same tested image:</text><text x="45" y="570" font-family="monospace" font-size="14" fill="#1d4ed8">USERNAME/mynginx:latest</text><text x="390" y="570" font-family="monospace" font-size="14" fill="#1d4ed8">USERNAME/mynginx:&lt;full-commit-sha&gt;</text><text x="45" y="600" font-family="Arial,sans-serif" font-size="12" fill="#40566f">Secrets remain in GitHub; never print token values or copy credentials into image layers.</text></svg>