<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Complete CI/CD journey</title><desc id="desc">A shared GitHub repository triggers separate pull-request CI and trusted main-branch publishing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs><rect width="1280" height="620" rx="24" fill="#f4f7fb"/>
<text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Complete CI/CD journey</text>
<text x="42" y="80" font-family="Arial,sans-serif" font-size="14" fill="#52657d">A shared GitHub repository triggers separate pull-request CI and trusted main-branch publishing.</text><rect x="55" y="105" width="230" height="96" rx="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="80" y="145" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142b4a">Developer</text><text x="80" y="175" font-family="Arial,sans-serif" font-size="13" fill="#334155">edit · commit · push</text><path d="M285 153 L365 153" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="105" width="285" height="96" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="390" y="145" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142b4a">GitHub repository</text><text x="390" y="175" font-family="Arial,sans-serif" font-size="13" fill="#334155">source + trigger workflows</text><text x="710" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#40566f">event filters select one lane below</text><rect x="30" y="230" width="1220" height="155" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="50" y="258" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">CI · pull_request to main · no Docker Hub credentials · no image publishing</text><rect x="30" y="405" width="1220" height="175" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="50" y="433" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">PUBLISH · push to main or manual main run · tested image is published</text><rect x="55" y="275" width="230" height="92" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="79" cy="299" r="13" fill="#3b82f6"/><text x="79" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">1</text><text x="101" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Runner</text><text x="70" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">GitHub-hosted VM</text><text x="70" y="362" font-family="Arial,sans-serif" font-size="13" fill="#334155">checkout source</text><rect x="355" y="275" width="230" height="92" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="379" cy="299" r="13" fill="#16a34a"/><text x="379" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">2</text><text x="401" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Build</text><text x="370" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">Dockerfile + context</text><text x="370" y="362" font-family="Arial,sans-serif" font-size="13" fill="#334155">start NGINX container</text><rect x="655" y="275" width="230" height="92" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="679" cy="299" r="13" fill="#d97706"/><text x="679" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">3</text><text x="701" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">HTTP test</text><text x="670" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">curl page marker</text><text x="670" y="362" font-family="Arial,sans-serif" font-size="13" fill="#334155">and health endpoint</text><rect x="955" y="275" width="230" height="92" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="979" cy="299" r="13" fill="#7c3aed"/><text x="979" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">4</text><text x="1001" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Cleanup</text><text x="970" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">diagnostics on fail</text><text x="970" y="362" font-family="Arial,sans-serif" font-size="13" fill="#334155">always remove container</text><path d="M285 321 L355 321" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 321 L655 321" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 321 L955 321" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="455" width="210" height="95" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="69" cy="479" r="13" fill="#3b82f6"/><text x="69" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">1</text><text x="91" y="484" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Main event</text><text x="60" y="520" font-family="Arial,sans-serif" font-size="13" fill="#334155">push / dispatch</text><text x="60" y="542" font-family="Arial,sans-serif" font-size="13" fill="#334155">branch guard: main</text><rect x="285" y="455" width="210" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="309" cy="479" r="13" fill="#16a34a"/><text x="309" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">2</text><text x="331" y="484" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Build + test</text><text x="300" y="520" font-family="Arial,sans-serif" font-size="13" fill="#334155">same Dockerfile</text><text x="300" y="542" font-family="Arial,sans-serif" font-size="13" fill="#334155">HTTP assertions</text><rect x="525" y="455" width="210" height="95" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="549" cy="479" r="13" fill="#d97706"/><text x="549" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">3</text><text x="571" y="484" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Login action</text><text x="540" y="520" font-family="Arial,sans-serif" font-size="13" fill="#334155">GitHub token secret</text><text x="540" y="542" font-family="Arial,sans-serif" font-size="13" fill="#334155">after tests pass</text><rect x="765" y="455" width="210" height="95" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="789" cy="479" r="13" fill="#7c3aed"/><text x="789" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">4</text><text x="811" y="484" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Tags + push</text><text x="780" y="520" font-family="Arial,sans-serif" font-size="13" fill="#334155">latest + full SHA</text><text x="780" y="542" font-family="Arial,sans-serif" font-size="13" fill="#334155">push both tags</text><rect x="1005" y="455" width="210" height="95" rx="16" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="1029" cy="479" r="13" fill="#e11d48"/><text x="1029" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">5</text><text x="1051" y="484" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Docker Hub</text><text x="1020" y="520" font-family="Arial,sans-serif" font-size="13" fill="#334155">mynginx repository</text><text x="1020" y="542" font-family="Arial,sans-serif" font-size="13" fill="#334155">pull to verify</text><path d="M255 502 L285 502" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M495 502 L525 502" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M735 502 L765 502" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M975 502 L1005 502" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><text x='42' y='608' font-family='Arial,sans-serif' font-size='13' fill='#40566f'>A runner's localhost is private to that runner VM. Later verification pulls the registry image to a learner's machine.</text></svg>