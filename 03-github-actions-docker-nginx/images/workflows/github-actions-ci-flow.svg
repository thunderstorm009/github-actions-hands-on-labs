<rect width="1280" height="620" rx="24" fill="#f4f7fb"/><text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">GitHub Actions CI: build and HTTP smoke test</text><text x="42" y="80" font-family="Arial,sans-serif" font-size="15" fill="#52657d">Pull requests validate the image; this workflow has no Docker Hub login step or publishing secret.</text><path d="M190 255 L235 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="138.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="212.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">event</text><path d="M400 255 L445 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="348.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="422.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">code</text><path d="M610 255 L655 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="558.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="632.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">Dockerfile</text><path d="M820 255 L865 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="768.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="842.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">port 8080</text><path d="M1030 255 L1075 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="978.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="1052.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">result</text><rect x="25" y="180" width="165" height="150" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="52" cy="207" r="15" fill="#3b82f6"/><text x="52" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">1</text><text x="77" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Pull request</text><text x="45" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">target: main</text><text x="45" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">EVENT</text><rect x="235" y="180" width="165" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="262" cy="207" r="15" fill="#16a34a"/><text x="262" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">2</text><text x="287" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Runner</text><text x="255" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">GitHub-hosted</text><text x="255" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">Ubuntu VM</text><text x="255" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">ISOLATED VM</text><rect x="445" y="180" width="165" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="472" cy="207" r="15" fill="#d97706"/><text x="472" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">3</text><text x="497" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Checkout</text><text x="465" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">source +</text><text x="465" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">workflow files</text><text x="465" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">STEP</text><rect x="655" y="180" width="165" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="682" cy="207" r="15" fill="#7c3aed"/><text x="682" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">4</text><text x="707" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Build</text><text x="675" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">docker build</text><text x="675" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">local runner image</text><text x="675" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">STEP</text><rect x="865" y="180" width="165" height="150" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="892" cy="207" r="15" fill="#e11d48"/><text x="892" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">5</text><text x="917" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Run + test</text><text x="885" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">NGINX container</text><text x="885" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">curl marker + health</text><text x="885" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#e11d48">STEP</text><rect x="1075" y="180" width="175" height="150" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><circle cx="1102" cy="207" r="15" fill="#0891b2"/><text x="1102" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">6</text><text x="1127" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Cleanup</text><text x="1095" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">logs on failure</text><text x="1095" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">always remove</text><text x="1095" y="313" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0891b2">STEP</text><line x1="42" y1="568" x2="1238" y2="568" stroke="#d6e0eb"/><text x="42" y="594" font-family="Arial,sans-serif" font-size="14" fill="#40566f">The curl command runs inside the runner against 127.0.0.1:8080; it does not reach the learner&#x27;s local browser.</text></svg>