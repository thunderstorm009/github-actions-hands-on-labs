<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#142b4a">NGINX configuration maps requests to files</text><text x="40" y="77" font-family="Arial,sans-serif" font-size="14" fill="#52657d">These directives correspond to nginx.conf and the Dockerfile copy destination.</text><path d="M255 260 L300 260" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="277.5" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">request</text><path d="M510 260 L555 260" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="532.5" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">map URI</text><path d="M795 260 L840 260" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="817.5" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">index lookup</text><rect x="45" y="185" width="210" height="150" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="70" cy="210" r="13" fill="#3b82f6"/><text x="70" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">1</text><text x="93" y="215" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">listen 80</text><text x="61" y="245" font-family="Arial,sans-serif" font-size="13" fill="#334155">NGINX accepts HTTP</text><text x="61" y="265" font-family="Arial,sans-serif" font-size="13" fill="#334155">inside the container</text><text x="61" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#3b82f6">CONTAINER PORT</text><rect x="300" y="185" width="210" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="325" cy="210" r="13" fill="#16a34a"/><text x="325" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text><text x="348" y="215" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">location /</text><text x="316" y="245" font-family="Arial,sans-serif" font-size="13" fill="#334155">matches page paths</text><text x="316" y="265" font-family="Arial,sans-serif" font-size="13" fill="#334155">try_files checks target</text><text x="316" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#16a34a">ROUTE</text><rect x="555" y="185" width="240" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="580" cy="210" r="13" fill="#d97706"/><text x="580" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">3</text><text x="603" y="215" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">root</text><text x="571" y="245" font-family="Arial,sans-serif" font-size="13" fill="#334155">/usr/share/nginx/html</text><text x="571" y="265" font-family="Arial,sans-serif" font-size="13" fill="#334155">document directory</text><text x="571" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706">FILESYSTEM PATH</text><rect x="840" y="185" width="290" height="150" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="865" cy="210" r="13" fill="#7c3aed"/><text x="865" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text><text x="888" y="215" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">index index.html</text><text x="856" y="245" font-family="Arial,sans-serif" font-size="13" fill="#334155">request to / selects</text><text x="856" y="265" font-family="Arial,sans-serif" font-size="13" fill="#334155">website/index.html</text><text x="856" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">DEFAULT PAGE</text><line x1="40" y1="518" x2="1160" y2="518" stroke="#d6e0eb"/><text x="40" y="542" font-family="Arial,sans-serif" font-size="13" fill="#40566f">Dockerfile copies nginx.conf to /etc/nginx/conf.d/default.conf and website/ to the configured document root.</text></svg>