<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1280" height="620" rx="24" fill="#f4f7fb"/><text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Dockerfile, build context, and resulting image</text><text x="42" y="80" font-family="Arial,sans-serif" font-size="15" fill="#52657d">Only files inside the selected build context can be copied; .dockerignore filters that context.</text><path d="M265 255 L330 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="223.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="297.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">select</text><path d="M555 255 L620 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="513.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="587.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">filtered context</text><path d="M870 255 L955 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="838.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="912.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">docker build</text><rect x="40" y="170" width="225" height="170" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="67" cy="197" r="15" fill="#3b82f6"/><text x="67" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">1</text><text x="92" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Build context .</text><text x="60" y="236" font-family="Arial,sans-serif" font-size="14" fill="#334155">Dockerfile</text><text x="60" y="258" font-family="Arial,sans-serif" font-size="14" fill="#334155">nginx.conf + website/</text><text x="60" y="323" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">INPUT FILES</text><rect x="330" y="170" width="225" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="357" cy="197" r="15" fill="#16a34a"/><text x="357" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">2</text><text x="382" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">.dockerignore</text><text x="350" y="236" font-family="Arial,sans-serif" font-size="14" fill="#334155">Exclude .git, docs, images,</text><text x="350" y="258" font-family="Arial,sans-serif" font-size="14" fill="#334155">local environment files</text><text x="350" y="323" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">FILTER</text><rect x="620" y="170" width="250" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="647" cy="197" r="15" fill="#d97706"/><text x="647" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">3</text><text x="672" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Dockerfile steps</text><text x="640" y="236" font-family="Arial,sans-serif" font-size="14" fill="#334155">FROM official NGINX</text><text x="640" y="258" font-family="Arial,sans-serif" font-size="14" fill="#334155">COPY config + HTML</text><text x="640" y="280" font-family="Arial,sans-serif" font-size="14" fill="#334155">EXPOSE 80 · CMD</text><text x="640" y="323" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">INSTRUCTIONS</text><rect x="955" y="170" width="270" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="982" cy="197" r="15" fill="#7c3aed"/><text x="982" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">4</text><text x="1007" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Image layers</text><text x="975" y="236" font-family="Arial,sans-serif" font-size="14" fill="#334155">NGINX base + server config</text><text x="975" y="258" font-family="Arial,sans-serif" font-size="14" fill="#334155">+ static website</text><text x="975" y="323" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">mynginx:test</text><line x1="42" y1="568" x2="1238" y2="568" stroke="#d6e0eb"/><text x="42" y="594" font-family="Arial,sans-serif" font-size="14" fill="#40566f">COPY sources are relative to the build context. EXPOSE documents container port 80; docker run -p performs port publishing.</text></svg>