"middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text><text x="878" y="260" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">GitHub behavior</text><text x="846" y="290" font-family="Arial,sans-serif" font-size="13" fill="#334155">Only root workflows run</text><text x="846" y="310" font-family="Arial,sans-serif" font-size="13" fill="#334155">Nested course copies are</text><text x="846" y="330" font-family="Arial,sans-serif" font-size="13" fill="#334155">learning source files</text><text x="846" y="376" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">COPY TO PRACTICE ROOT</text><line x1="40" y1="518" x2="1160" y2="518" stroke="#d6e0eb"/><text x="40" y="542" font-family="Arial,sans-serif" font-size="13" fill="#40566f">Do not push exercises into the course repository. Copy lab files into your separate practice repo.</text></svg>