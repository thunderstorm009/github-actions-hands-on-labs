<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1280" height="620" rx="24" fill="#f4f7fb"/><text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Docker image and container lifecycle</text><text x="42" y="80" font-family="Arial,sans-serif" font-size="15" fill="#52657d">An image is a packaged template; a container is a created runtime instance.</text><path d="M220 258 L280 258" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="176.0" y="241.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="250.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">build</text><path d="M465 258 L525 258" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="421.0" y="241.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="495.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">creates</text><path d="M710 258 L770 258" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="666.0" y="241.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="740.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">starts</text><path d="M955 258 L1015 258" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="911.0" y="241.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="985.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">instance</text><rect x="35" y="180" width="185" height="155" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="62" cy="207" r="15" fill="#3b82f6"/><text x="62" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">1</text><text x="87" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Dockerfile</text><text x="55" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">instructions +</text><text x="55" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">context</text><text x="55" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">SOURCE</text><rect x="280" y="180" width="185" height="155" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="307" cy="207" r="15" fill="#16a34a"/><text x="307" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">2</text><text x="332" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Build</text><text x="300" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">docker build</text><text x="300" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">cacheable layers</text><text x="300" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">COMMAND</text><rect x="525" y="180" width="185" height="155" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="552" cy="207" r="15" fill="#d97706"/><text x="552" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">3</text><text x="577" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Image</text><text x="545" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">tagged template</text><text x="545" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">mynginx:test</text><text x="545" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">STORED</text><rect x="770" y="180" width="185" height="155" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="797" cy="207" r="15" fill="#7c3aed"/><text x="797" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">4</text><text x="822" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Run</text><text x="790" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">docker run</text><text x="790" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">create + start</text><text x="790" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">COMMAND</text><rect x="1015" y="180" width="220" height="155" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="1042" cy="207" r="15" fill="#e11d48"/><text x="1042" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">5</text><text x="1067" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Container</text><text x="1035" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">running NGINX</text><text x="1035" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">writable runtime</text><text x="1035" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#e11d48">INSTANCE</text><line x1="42" y1="568" x2="1238" y2="568" stroke="#d6e0eb"/><text x="42" y="594" font-family="Arial,sans-serif" font-size="14" fill="#40566f">docker stop halts the process; docker rm removes the container record. Removing a container does not automatically remove its image.</text></svg>