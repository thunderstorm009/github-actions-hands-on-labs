<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1280" height="620" rx="24" fill="#f4f7fb"/><text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Local browser to container port mapping</text><text x="42" y="80" font-family="Arial,sans-serif" font-size="15" fill="#52657d">The -p option uses HOST_PORT:CONTAINER_PORT.</text><path d="M235 262 L285 262" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="186.0" y="245.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="260.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">connect</text><path d="M490 262 L540 262" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="441.0" y="245.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="515.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">forward</text><path d="M745 262 L795 262" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="696.0" y="245.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="770.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">NAT</text><path d="M1000 262 L1050 262" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="951.0" y="245.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="1025.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">HTTP</text><rect x="30" y="190" width="205" height="145" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="57" cy="217" r="15" fill="#3b82f6"/><text x="57" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">1</text><text x="82" y="222" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Browser</text><text x="50" y="256" font-family="Arial,sans-serif" font-size="14" fill="#334155">http://localhost:8000</text><text x="50" y="278" font-family="Arial,sans-serif" font-size="14" fill="#334155">request destination</text><text x="50" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">LOCAL CLIENT</text><rect x="285" y="190" width="205" height="145" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="312" cy="217" r="15" fill="#16a34a"/><text x="312" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">2</text><text x="337" y="222" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Host port</text><text x="305" y="256" font-family="Arial,sans-serif" font-size="14" fill="#334155">8000</text><text x="305" y="278" font-family="Arial,sans-serif" font-size="14" fill="#334155">computer listens here</text><text x="305" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">HOST</text><rect x="540" y="190" width="205" height="145" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="567" cy="217" r="15" fill="#d97706"/><text x="567" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">3</text><text x="592" y="222" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Docker publish</text><text x="560" y="256" font-family="Arial,sans-serif" font-size="14" fill="#334155">-p 8000:80</text><text x="560" y="278" font-family="Arial,sans-serif" font-size="14" fill="#334155">forward traffic</text><text x="560" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">PORT RULE</text><rect x="795" y="190" width="205" height="145" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="822" cy="217" r="15" fill="#7c3aed"/><text x="822" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">4</text><text x="847" y="222" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Container port</text><text x="815" y="256" font-family="Arial,sans-serif" font-size="14" fill="#334155">80</text><text x="815" y="278" font-family="Arial,sans-serif" font-size="14" fill="#334155">NGINX listens here</text><text x="815" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">CONTAINER</text><rect x="1050" y="190" width="200" height="145" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="1077" cy="217" r="15" fill="#e11d48"/><text x="1077" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">5</text><text x="1102" y="222" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">NGINX</text><text x="1070" y="256" font-family="Arial,sans-serif" font-size="14" fill="#334155">serves index.html</text><text x="1070" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#e11d48">SERVER</text><line x1="42" y1="568" x2="1238" y2="568" stroke="#d6e0eb"/><text x="42" y="594" font-family="Arial,sans-serif" font-size="14" fill="#40566f">The browser opens the host port. A container on a GitHub runner has a different localhost and is not exposed to your laptop.</text></svg>