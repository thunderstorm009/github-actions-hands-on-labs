<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Lab 03 system architecture</title><desc id="desc">Developer changes flow to GitHub. Pull requests run secret-free CI; trusted main pushes run a separate build-test-publish workflow to Docker Hub.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1400" height="700" rx="24" fill="#f4f7fb"/>
<text x="44" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#142b4a">Lab 03 system architecture</text>
<text x="44" y="82" font-family="Arial,sans-serif" font-size="15" fill="#52657d">A shared repository branches into secret-free CI and trusted Docker Hub publishing.</text>
<rect x="48" y="108" width="220" height="112" rx="18" fill="#e5f1ff" stroke="#3b82f6" stroke-width="2"/>
<text x="72" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142b4a">Developer</text>
<text x="72" y="181" font-family="Arial,sans-serif" font-size="14" fill="#334155">edit → commit → push</text>
<rect x="338" y="108" width="250" height="112" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="362" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142b4a">GitHub repository</text>
<text x="362" y="181" font-family="Arial,sans-serif" font-size="14" fill="#334155">source + workflow files</text>
<path d="M268 164 L338 164" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="252" width="1328" height="190" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="56" y="280" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">CI LANE · pull_request targeting main · no Docker Hub secrets · no image push</text>
<rect x="36" y="460" width="1328" height="190" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="56" y="488" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">PUBLISH LANE · push to main or manual main run · build and test before authentication</text><path d="M463 220 L463 242" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="240" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">workflow triggers route to one lane</text><rect x="80" y="300" width="205" height="110" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/><circle cx="102" cy="323" r="12" fill="#3b82f6"/><text x="102" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text><text x="122" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Pull request</text><text x="95" y="357" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">target main</text><text x="95" y="399" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#3b82f6">CI EVENT</text><rect x="325" y="300" width="205" height="110" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><circle cx="347" cy="323" r="12" fill="#16a34a"/><text x="347" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">2</text><text x="367" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">GitHub Actions</text><text x="340" y="357" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">hosted runner</text><text x="340" y="399" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#16a34a">CI WORKFLOW</text><rect x="570" y="300" width="205" height="110" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><circle cx="592" cy="323" r="12" fill="#d97706"/><text x="592" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">3</text><text x="612" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Docker build</text><text x="585" y="357" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">Dockerfile + context</text><text x="585" y="399" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#d97706">IMAGE</text><rect x="815" y="300" width="205" height="110" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><circle cx="837" cy="323" r="12" fill="#7c3aed"/><text x="837" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">4</text><text x="857" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">NGINX + HTTP</text><text x="830" y="357" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">container + smoke test</text><text x="830" y="399" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#7c3aed">VERIFY</text><rect x="1060" y="300" width="240" height="110" rx="15" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/><circle cx="1082" cy="323" r="12" fill="#0891b2"/><text x="1082" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">5</text><text x="1102" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Cleanup</text><text x="1075" y="357" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">always remove test container</text><text x="1075" y="399" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0891b2">CI ONLY</text><rect x="80" y="500" width="205" height="110" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/><circle cx="102" cy="523" r="12" fill="#3b82f6"/><text x="102" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">6</text><text x="122" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Push to main</text><text x="95" y="557" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">or dispatch on main</text><text x="95" y="599" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#3b82f6">TRUSTED EVENT</text><rect x="325" y="500" width="205" height="110" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><circle cx="347" cy="523" r="12" fill="#16a34a"/><text x="347" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">7</text><text x="367" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Publish workflow</text><text x="340" y="557" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">hosted runner</text><text x="340" y="599" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#16a34a">PUBLISH JOB</text><rect x="570" y="500" width="205" height="110" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><circle cx="592" cy="523" r="12" fill="#d97706"/><text x="592" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">8</text><text x="612" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Build + test</text><text x="585" y="557" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">same Dockerfile</text><text x="585" y="599" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#d97706">QUALITY GATE</text><rect x="815" y="500" width="205" height="110" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><circle cx="837" cy="523" r="12" fill="#7c3aed"/><text x="837" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">9</text><text x="857" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Login + tag</text><text x="830" y="557" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">latest + full SHA</text><text x="830" y="599" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#7c3aed">SECRET AFTER TEST</text><rect x="1060" y="500" width="240" height="110" rx="15" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8"/><circle cx="1082" cy="523" r="12" fill="#e11d48"/><text x="1082" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">10</text><text x="1102" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b4a">Docker Hub</text><text x="1075" y="557" font-family="Arial,sans-serif" font-size="12.5" fill="#334155">username/mynginx</text><text x="1075" y="599" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#e11d48">PUBLISHED IMAGE</text><path d="M285 355 L325 355" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 355 L570 355" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 355 L815 355" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 355 L1060 355" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M285 555 L325 555" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 555 L570 555" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 555 L815 555" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 555 L1060 555" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="678" font-family="Arial,sans-serif" font-size="13" fill="#40566f">The runner localhost belongs to its VM. The published image is verified later by pulling and running it on a consumer machine.</text></svg>