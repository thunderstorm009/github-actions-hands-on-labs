<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1280" height="620" rx="24" fill="#f4f7fb"/><text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b4a">Browser request to a static page</text><text x="42" y="80" font-family="Arial,sans-serif" font-size="15" fill="#52657d">The published/local host port is forwarded to NGINX on container port 80.</text><path d="M215 255 L260 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="163.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="237.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">HTTP GET</text><path d="M440 255 L485 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="388.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="462.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">forward</text><path d="M665 255 L710 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="613.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="687.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">root + index</text><path d="M920 255 L965 255" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><rect x="868.5" y="238.0" width="148" height="25" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="942.5" y="255.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">read file</text><rect x="35" y="180" width="180" height="155" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="62" cy="207" r="15" fill="#3b82f6"/><text x="62" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">1</text><text x="87" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Browser</text><text x="55" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">GET /</text><text x="55" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">localhost:8000</text><text x="55" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">CLIENT</text><rect x="260" y="180" width="180" height="155" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="287" cy="207" r="15" fill="#16a34a"/><text x="287" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">2</text><text x="312" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Port mapping</text><text x="280" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">Host :8000 →</text><text x="280" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">container :80</text><text x="280" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16a34a">NETWORK</text><rect x="485" y="180" width="180" height="155" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="512" cy="207" r="15" fill="#d97706"/><text x="512" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">3</text><text x="537" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">NGINX server</text><text x="505" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">listen 80</text><text x="505" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">uses nginx.conf</text><text x="505" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">WEB SERVER</text><rect x="710" y="180" width="210" height="155" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="737" cy="207" r="15" fill="#7c3aed"/><text x="737" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">4</text><text x="762" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">Document root</text><text x="730" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">/usr/share/nginx/html</text><text x="730" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">index index.html</text><text x="730" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7c3aed">FILESYSTEM</text><rect x="965" y="180" width="250" height="155" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><circle cx="992" cy="207" r="15" fill="#e11d48"/><text x="992" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">5</text><text x="1017" y="212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142b4a">index.html</text><text x="985" y="246" font-family="Arial,sans-serif" font-size="14" fill="#334155">Static HTML + CSS</text><text x="985" y="268" font-family="Arial,sans-serif" font-size="14" fill="#334155">HTTP 200 response</text><text x="985" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#e11d48">PAGE</text><line x1="42" y1="568" x2="1238" y2="568" stroke="#d6e0eb"/><text x="42" y="594" font-family="Arial,sans-serif" font-size="14" fill="#40566f">A request travels toward the file; NGINX sends the HTTP response back to the browser. Port 80 is inside the container.</text></svg>