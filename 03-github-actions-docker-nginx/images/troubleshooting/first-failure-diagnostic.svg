<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#52677f"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#142b4a">Docker and workflow troubleshooting path</text><text x="40" y="77" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Start from the first observable failure and inspect evidence before changing files.</text><path d="M275 230 L350 170" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="312.5" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">not running</text><path d="M275 255 L350 330" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="312.5" y="280.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">reachable?</text><path d="M585 165 L700 165" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="642.5" y="153.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">running</text><path d="M585 335 L700 335" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="642.5" y="323.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">workflow</text><path d="M935 165 L990 225" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="962.5" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">fix</text><path d="M935 335 L990 275" stroke="#52677f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="962.5" y="293.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#40566f">fix</text><rect x="40" y="170" width="235" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="65" cy="195" r="13" fill="#3b82f6"/><text x="65" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">1</text><text x="88" y="200" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">HTTP check fails</text><text x="56" y="230" font-family="Arial,sans-serif" font-size="13" fill="#334155">curl returns non-200</text><text x="56" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">or marker is missing</text><text x="56" y="316" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#3b82f6">SYMPTOM</text><rect x="350" y="95" width="235" height="145" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="375" cy="120" r="13" fill="#16a34a"/><text x="375" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">2</text><text x="398" y="125" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">Container stopped</text><text x="366" y="155" font-family="Arial,sans-serif" font-size="13" fill="#334155">docker ps -a</text><text x="366" y="175" font-family="Arial,sans-serif" font-size="13" fill="#334155">docker logs name</text><text x="366" y="226" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#16a34a">CHECK PROCESS</text><rect x="350" y="260" width="235" height="145" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="375" cy="285" r="13" fill="#d97706"/><text x="375" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">3</text><text x="398" y="290" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">Port mismatch</text><text x="366" y="320" font-family="Arial,sans-serif" font-size="13" fill="#334155">docker ps mapping</text><text x="366" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">host :8000 → :80</text><text x="366" y="391" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706">CHECK NETWORK</text><rect x="700" y="95" width="235" height="145" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="725" cy="120" r="13" fill="#7c3aed"/><text x="725" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">4</text><text x="748" y="125" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">404 / wrong page</text><text x="716" y="155" font-family="Arial,sans-serif" font-size="13" fill="#334155">inspect root/index</text><text x="716" y="175" font-family="Arial,sans-serif" font-size="13" fill="#334155">rebuild image</text><text x="716" y="226" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">CHECK CONTENT</text><rect x="700" y="260" width="235" height="145" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><circle cx="725" cy="285" r="13" fill="#0891b2"/><text x="725" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">5</text><text x="748" y="290" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">CI red step</text><text x="716" y="320" font-family="Arial,sans-serif" font-size="13" fill="#334155">open first failed step</text><text x="716" y="340" font-family="Arial,sans-serif" font-size="13" fill="#334155">read runner logs</text><text x="716" y="391" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0891b2">CHECK ACTIONS</text><rect x="990" y="170" width="185" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><circle cx="1015" cy="195" r="13" fill="#3b82f6"/><text x="1015" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">6</text><text x="1038" y="200" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#142b4a">Repair + retry</text><text x="1006" y="230" font-family="Arial,sans-serif" font-size="13" fill="#334155">change one cause</text><text x="1006" y="250" font-family="Arial,sans-serif" font-size="13" fill="#334155">verify again</text><text x="1006" y="316" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#3b82f6">CHECKPOINT</text><line x1="40" y1="518" x2="1160" y2="518" stroke="#d6e0eb"/><text x="40" y="542" font-family="Arial,sans-serif" font-size="13" fill="#40566f">Capture genuine failure and repair runs separately. A diagram or placeholder card is not proof that a run occurred.</text></svg>