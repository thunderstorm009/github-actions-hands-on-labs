name: Build, test, and publish to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Verify and publish image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag lab-nginx:release .
      - name: Start container
        run: docker run --detach --publish 127.0.0.1:8080:80 --name lab-nginx-release lab-nginx:release
      - name: Verify image before publishing
        shell: bash
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ -o response.html; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "NGINX did not answer after 10 attempts." >&2
              exit 1
            fi
            sleep 2
          done
          grep --fixed-strings "NGINX_DOCKER_HUB_LAB_READY" response.html
          test "$(curl --fail --silent http://127.0.0.1:8080/healthz)" = "healthy"
          echo "Image passed HTTP checks; publishing may proceed."
      - name: Print diagnostics after a failure
        if: failure()
        run: |
          docker ps --all || true
          docker logs lab-nginx-release || true
          docker inspect lab-nginx-release || true
      - name: Clean up verification container
        if: always()
        run: docker rm --force lab-nginx-release || true
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag and push tested image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag lab-nginx:release "$DOCKER_USERNAME/mynginx:latest"
          docker tag lab-nginx:release "$DOCKER_USERNAME/mynginx:$IMAGE_SHA"
          docker push "$DOCKER_USERNAME/mynginx:latest"
          docker push "$DOCKER_USERNAME/mynginx:$IMAGE_SHA"
